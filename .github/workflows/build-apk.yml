name: Build Android APK

# 用 Capacitor 把网页打成安卓 APK，发布到 GitHub Release（滚动标签 android-latest）。
# - 配了发布签名密钥（secrets）就用正式签名；
# - 没配就用 debug 签名，并把 debug 密钥缓存起来，尽量让新包能覆盖安装旧包。
on:
  workflow_dispatch:
  push:
    branches: [main, ccr-b3faae40-j5dzj0]
    paths:
      - 'index.html'
      - 'style.css'
      - 'manifest.webmanifest'
      - 'src/**'
      - 'icons/**'
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

defaults:
  run:
    working-directory: android-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 构建号 = 提交总数，浅克隆会永远是 1

      - name: Compute build number
        id: ver
        run: |
          BUILD="$(git rev-list --count HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=1.0.$BUILD ($SHORT)" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$BUILD" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Collect web assets into www/
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          BUILD_VERSION: ${{ steps.ver.outputs.name }}
        run: node build-www.mjs

      - name: Add Android platform
        run: npx cap add android

      # 安卓覆盖安装时会比较 versionCode，必须单调递增
      - name: Stamp Android package version
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${BUILD_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${BUILD_NUMBER}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Generate launcher icons & splash
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      # 没配发布密钥时：debug 密钥放进缓存，下次构建沿用同一个签名
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Ensure debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "已生成新的 debug 密钥"
          else
            echo "沿用缓存里的 debug 密钥"
          fi

      - name: Build & sign APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          set -o pipefail
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "检测到发布签名密钥，使用正式签名"
            echo "$KEYSTORE_BASE64" | base64 -d > ../release.jks
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign \
              --ks ../release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
              --out ../ai-wolf-pro.apk aligned.apk
            echo "signed=正式" >> "$GITHUB_OUTPUT"
          else
            echo "未配置发布签名密钥，使用 debug 签名"
            # 显式指定签名密钥。不指定的话 Gradle 不一定用 ~/.android 下的那把，
            # 每次打包签名都不同，新包就没法覆盖安装旧包。
            ./gradlew assembleDebug --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android 2>&1 | tee ../gradle-build.log
            cp app/build/outputs/apk/debug/app-debug.apk ../ai-wolf-pro.apk
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi
          cd ..
          ls -la ai-wolf-pro.apk

      # 自检：包上的签名证书必须就是缓存里那把密钥的证书，否则覆盖安装会失败
      - name: Verify signing certificate
        id: cert
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK_FP="$("$BT/apksigner" verify --print-certs ai-wolf-pro.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
          echo "APK 签名证书 SHA-256: $APK_FP"
          echo "fingerprint=$APK_FP" >> "$GITHUB_OUTPUT"
          echo "签名证书 SHA-256: \`$APK_FP\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build.outputs.signed }}" = "debug" ]; then
            KS_FP="$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
            echo "缓存密钥证书 SHA-256: $KS_FP"
            if [ "$APK_FP" != "$KS_FP" ]; then
              echo "::error::APK 的签名和缓存里的密钥不一致，新包将无法覆盖安装旧包"
              exit 1
            fi
          fi

      # APP 启动时读这个文件判断有没有新版（更新提醒）
      - name: Write version.json
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          BUILD_VERSION: ${{ steps.ver.outputs.name }}
          CERT_SHA256: ${{ steps.cert.outputs.fingerprint }}
        run: |
          NOTES="$(git log -1 --pretty=%s)" node -e '
            const fs = require("fs");
            fs.writeFileSync("version.json", JSON.stringify({
              build: Number(process.env.BUILD_NUMBER),
              version: process.env.BUILD_VERSION,
              notes: process.env.NOTES || "",
              date: new Date().toISOString(),
              cert: process.env.CERT_SHA256 || "",
              apk: "https://github.com/" + process.env.GITHUB_REPOSITORY + "/releases/download/android-latest/ai-wolf-pro.apk"
            }, null, 2));
          '
          cat version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-wolf-pro-apk
          path: android-app/ai-wolf-pro.apk
          if-no-files-found: error

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android-app/gradle-build.log
          if-no-files-found: ignore

      - name: Report Gradle root cause
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            DETAILS="$(grep -A 18 -m1 '^\* What went wrong:' gradle-build.log | tail -n +2 | tr '\n' ' ' | head -c 1800)"
            DETAILS="${DETAILS//'%'/'%25'}"
            echo "::error title=Gradle root cause::$DETAILS"
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: AI狼人杀Pro · 安卓版（最新）
          body: |
            自动构建的安卓 APK（${{ steps.build.outputs.signed }} 签名）· 版本 `${{ steps.ver.outputs.version }}`。
            签名证书 SHA-256：`${{ steps.cert.outputs.fingerprint }}`（每次打包都应相同，相同才能覆盖安装）。

            下载下方的 `ai-wolf-pro.apk`，在手机上安装即可。打开后在「设置 → 模型库」里填模型的 API key。
            安卓版的请求走原生网络，不受浏览器跨域限制，网页版连不上的中转站在这里通常能用。
          files: |
            android-app/ai-wolf-pro.apk
            android-app/version.json
          make_latest: true
