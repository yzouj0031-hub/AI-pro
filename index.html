<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI狼人杀">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>AI 狼人杀 · 一桌会聊天的 AI</title>
<meta name="description" content="让不同大模型坐在一桌打狼人杀。每个 AI 是一个有记忆、有性格的参与者，不是读卷宗的旁观者。">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>

<div class="update-bar" id="update-bar" hidden>
  <span id="update-text"></span>
  <a id="update-link" class="btn rose" href="#">下载新版</a>
  <button id="update-skip" class="btn small">这版先不更</button>
</div>

<div class="app">
  <aside class="seats left">
    <div class="seats-title">— 左 席 —</div>
    <div class="seat-list" id="seats-left"></div>
  </aside>

  <main class="center">
    <div class="statusbar">
      <button id="btn-back" class="btn rose">← 退</button>
      <div class="stat" id="stat-round">第0回</div>
      <div class="stat" id="stat-phase">等待中</div>
      <div class="stat" id="stat-alive">存活:0</div>
      <button id="btn-toggle-settings" class="link">▼ 展开设置</button>
    </div>

    <section class="panel settings-panel" id="settings-panel">
      <div class="panel-head">⚙ 设置面板</div>
      <button class="settings-summary" id="settings-summary">
        <span class="ss-title">⚙ 对局设置</span>
        <span class="ss-text" id="settings-summary-text"></span>
        <span class="ss-toggle" id="settings-summary-toggle">展开</span>
      </button>
      <div class="settings-body" id="settings-body" hidden>
        <div class="settings-grid">
          <div class="block">
            <h3>模型库 <button id="btn-add-model" class="btn small">＋ 添加</button></h3>
            <p class="hint">key 只存在这台设备上，请求直接发给各家接口。勾选的模型会被随机分给没指定模型的座位。</p>
            <ul id="model-list" class="model-list"></ul>
          </div>
          <div class="block">
            <h3>这一局</h3>
            <label class="inline">人数 <select id="player-count"></select></label>
            <div class="comp" id="composition"></div>
            <details>
              <summary>规则细节</summary>
              <label class="check"><input type="checkbox" id="opt-selfsave"> 女巫可以自救</label>
              <label class="check"><input type="checkbox" id="opt-lastwords"> 首夜死者有遗言</label>
              <label class="check"><input type="checkbox" id="opt-freetalk"> 轮流发言后有自由讨论</label>
              <label class="inline">胜负 <select id="opt-winmode">
                <option value="side">屠边（神或民死光狼胜）</option>
                <option value="all">屠城（狼不少于好人时狼胜）</option>
              </select></label>
              <label class="inline">狼人夜间商量 <select id="opt-wolfrounds"><option value="1">1 轮</option><option value="2">2 轮</option><option value="0">不商量</option></select></label>
            </details>
          </div>
          <div class="block">
            <h3>座位</h3>
            <p class="hint">点两侧的座位，可以改名字、人设、头像，指定用哪个模型、拿什么身份，或者自己坐上去。</p>
            <button id="btn-reroll" class="btn small">全部换成随机人设</button>
          </div>
        </div>
      </div>
    </section>

    <section class="log" id="log"></section>

    <div class="human-bar" id="human-bar" hidden>
      <div class="human-task" id="human-task"></div>
      <div class="human-options" id="human-options"></div>
      <div class="human-input">
        <textarea id="human-text" rows="2" placeholder="说点什么…"></textarea>
        <button id="human-send" class="btn rose">发送</button>
      </div>
    </div>

    <div class="actions">
      <button id="btn-start" class="act rose">▷ 开局</button>
      <button id="btn-step" class="act" disabled>⏭ 继续</button>
      <button id="btn-auto" class="act violet">⟳ 自动</button>
    </div>

    <div class="more">
      <button id="btn-more" class="more-toggle">··· 更多功能 ⌄</button>
      <div class="more-body" id="more-body" hidden>
        <label class="inline">节奏 <select id="speed">
          <option value="0">不等待</option>
          <option value="800">快</option>
          <option value="2000">正常</option>
          <option value="4500">慢</option>
        </select></label>
        <label class="check"><input type="checkbox" id="god-view"> 上帝视角</label>
        <button id="btn-export" class="btn small" disabled>导出记录</button>
        <button id="btn-import" class="btn small">导入回放</button>
        <button id="btn-demo" class="btn small">🧪 假模型试跑</button>
        <span id="app-version" hidden><span id="app-version-text" class="hint"></span> <button id="btn-check-update" class="btn small">检查更新</button> <span class="hint" id="app-update-result"></span></span>
        <input type="file" id="file-import" accept="application/json" hidden>
      </div>
    </div>
  </main>

  <aside class="seats right">
    <div class="seats-title">— 右 席 —</div>
    <div class="seat-list" id="seats-right"></div>
  </aside>
</div>

<!-- 座位设置 -->
<dialog id="seat-dialog">
  <form method="dialog" id="seat-form">
    <div class="dlg-head">
      <h3 id="sf-title">⚙ P1</h3>
      <select id="sf-role"></select>
    </div>
    <label>名讳 <input id="sf-name" maxlength="12" required></label>
    <label>模型
      <div class="row">
        <select id="sf-model"></select>
        <button type="button" id="sf-test" class="btn green">🧪 测试</button>
      </div>
    </label>
    <div class="row">
      <button type="button" id="sf-new-model" class="btn small">📚 往模型库里加一个</button>
      <span id="sf-test-result" class="hint"></span>
    </div>
    <label>人设 <textarea id="sf-bio" rows="4" placeholder="这个人是谁、怎么说话。例如：你是死亡笔记里的 L。"></textarea></label>
    <label>头像
      <div class="row">
        <button type="button" id="sf-upload" class="btn small">📁 上传</button>
        <button type="button" id="sf-clear-avatar" class="btn small">清除</button>
        <span class="avatar preview" id="sf-avatar">?</span>
        <input type="file" id="sf-file" accept="image/*" hidden>
      </div>
    </label>
    <div class="dialog-actions">
      <button type="button" id="sf-random" class="btn small">换个随机人设</button>
      <span class="spacer"></span>
      <button type="button" id="sf-cancel" class="btn">取消</button>
      <button type="submit" class="btn rose">保存</button>
    </div>
  </form>
</dialog>

<!-- 模型库条目 -->
<dialog id="model-dialog">
  <form method="dialog" id="model-form">
    <div class="dlg-head"><h3 id="model-dialog-title">添加模型</h3></div>
    <label>快速选择
      <select id="mf-preset"><option value="">— 自定义 —</option></select>
    </label>
    <label>显示名 <input id="mf-label" placeholder="例如 Claude"></label>
    <label>API地址 <input id="mf-url" placeholder="https://api.openai.com/v1"></label>
    <label>渠道
      <select id="mf-type">
        <option value="openai">OpenAI 兼容（OpenAI / DeepSeek / Qwen / Kimi / Grok / OpenRouter / 中转）</option>
        <option value="anthropic">Anthropic</option>
        <option value="gemini">Google Gemini</option>
      </select>
    </label>
    <label>API密钥 <input id="mf-key" type="password" autocomplete="off"></label>
    <label>模型
      <div class="row">
        <input id="mf-model" placeholder="模型名" required>
        <button type="button" id="mf-test" class="btn green">🧪 测试</button>
      </div>
    </label>
    <span id="mf-test-result" class="hint"></span>
    <div class="dialog-actions">
      <span class="spacer"></span>
      <button type="button" id="mf-cancel" class="btn">取消</button>
      <button type="submit" class="btn rose">保存</button>
    </div>
  </form>
</dialog>

<!-- 心里话 -->
<dialog id="mind-dialog" class="wide">
  <div class="dlg-head">
    <h3 id="mind-title">心里话</h3>
    <button id="mind-close" class="btn small">关闭</button>
  </div>
  <div id="mind-content" class="mind"></div>
</dialog>

<script type="module" src="src/app.js"></script>
</body>
</html>
